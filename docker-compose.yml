services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: qatra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qatra
      POSTGRES_USER: qatra
      POSTGRES_PASSWORD: qatra
    ports:
      - "5433:5432"
    volumes:
      - qatra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatra -d qatra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qatra_postgres_data:
